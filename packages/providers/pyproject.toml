[project]
name = "brainbench-providers"
version = "0.1.0"
description = "BrainBench provider layer: registry, vault, OAuth engines, refresher, usage, transports"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=46",
    "httpx>=0.28.1,<1",
    "pyyaml>=6.0.2",
    "strands-agents==1.59.0",
    "xxhash>=3.5",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
