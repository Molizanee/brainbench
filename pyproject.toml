[tool.uv.workspace]
members = ["apps/api", "packages/providers", "packages/agents"]

[dependency-groups]
dev = [
    "aiosqlite>=0.21",
    "httpx2>=2.13",
    "mypy>=2.0",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.15",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["apps/web", "node_modules", "openspec", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app", "brainbench_providers", "brainbench_agents"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = ["apps/api", "packages/providers/src", "packages/agents/src"]
explicit_package_bases = true
exclude = ["(^|/)migrations/versions/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "argon2.*", "docker.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["apps/api/tests", "packages/providers/tests", "packages/agents/tests"]
addopts = ["--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs external services (Postgres, Docker); run in a separate CI job"]
