[project]
name = "brainbench-api"
version = "0.1.0"
description = "BrainBench API and worker"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "asyncpg>=0.30",
    "brainbench-agents",
    "brainbench-providers",
    "docker>=7.1",
    "fastapi>=0.120",
    "itsdangerous>=2.2",
    "pgvector>=0.4",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn>=0.38",
]

[project.scripts]
brainbench-worker = "app.worker:main"
brainbench-bootstrap = "app.bootstrap:main"

[tool.uv.sources]
brainbench-agents = { workspace = true }
brainbench-providers = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
